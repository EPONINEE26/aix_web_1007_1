{% extends "base.html" %}
{% load static %}

{% block script-block %}
<link rel="stylesheet" href="/static/css/login.css">

<script>
    // 일반 제출의 결과값입니다. 1은 로그인 성공, 0은 실패, 2는 로그아웃입니다.
    if(new URLSearchParams(window.location.search).get('login_required') === '1'){
        alert('로그인이 필요한 서비스입니다.');
    }
    if('{{temp}}' == '1'){
        alert('로그인이 되었습니다.');
        location.href = '/';
    } else if ('{{temp}}' == '0'){
        alert('아이디 또는 패스워드가 일치하지 않습니다. 다시 로그인하세요.');
    } else if ('{{temp}}' == '2'){
        alert('로그아웃이 되었습니다.');
        location.href = '/';
    }
</script>
{% endblock script-block %}

{% block content-block %}

<!-- 첫 번째 디자인의 이미지 배너 -->
<section class="visual">
    <div>
        <h1>LOGIN</h1>
        <p>로그인 후 다양한 서비스를 이용하세요.</p>
    </div>
</section>

<!-- 두 번째 디자인의 로그인 영역 -->
<main class="login-section">
    <section class="login-box" aria-labelledby="login-title">
        <h2 id="login-title">로그인</h2>

        <form data-ajax action="/member/login/" name="loginFrm" method="post">
            {% csrf_token %}

            <label for="user-id" class="sr-only"></label>
            <input
                type="text"
                id="user-id"
                name="id"
                class="input-box"
                placeholder="아이디"
                autocomplete="username"
                required
            >

            <label for="user-password" class="sr-only"></label>
            <input
                type="password"
                id="user-password"
                name="pw"
                class="input-box"
                placeholder="비밀번호"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn btn-login">로그인</button>

            <div class="idsave">
                <input type="checkbox" id="rememberId" name="rememberId">
                <label for="rememberId">아이디 저장</label>
            </div>
        </form>

        <div class="links">
            <a href="#">아이디 찾기</a> |
            <a href="#">비밀번호 찾기</a>
        </div>

        <div class="signup-box">
            <p><strong>아직 회원이 아니신가요?</strong></p>
            <p>
                지금 회원가입을 하시면<br>
                다양하고 특별한 혜택이 준비되어 있습니다.
            </p>
            <button
                type="button"
                class="btn-signup"
                onclick="location.href='/member/membership1/'">
                회원가입
            </button>
        </div>
    </section>
</main>

{% endblock content-block %}
