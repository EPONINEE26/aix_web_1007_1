<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생성적입력</title>
</head>
<body>
    <h1>학생성적입력</h1>
    <form action="/stuscore/score_write/" method="post">
        <!--
            {% csrf_token %}: POST 요청 위조 방지용 Django 템플릿 태그.
            서버가 페이지를 만든 뒤 발급한 토큰을 숨은 input 형태로 출력.
            POST 요청이 들어오면 Django가 이 토큰을 확인.
        -->
        {% csrf_token %}
        <label>번호</label>
        <input type="text" name="no" id="no" required><br>
        <label>이름</label>
        <input type="text" name="name" id="name" required><br>
        <label>학교</label>
        <input type="text" name="school" id="school"><br>
        <label>학년</label>
        <input type="text" name="grade" id="grade"><br>
        <label>키</label>
        <input type="text" name="stature" id="stature"><br>
        <label>국어</label>
        <input type="text" name="kor" id="kor"><br>
        <label>영어</label>
        <input type="text" name="eng" id="eng"><br>
        <label>수학</label>
        <input type="text" name="math" id="math"><br>
        <label>SW특기</label>
        <input type="text" name="sw" id="sw"><br>
        <input type="submit" value="저장">
    </form>
</body>
</html>
